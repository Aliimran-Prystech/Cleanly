<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- House Walls and Floor Base -->
  <path d="M 22 45 L 22 80 L 78 80 L 78 45" stroke="#48C3D3" stroke-width="5" fill="none" stroke-linecap="butt"/>
  
  <!-- Outer Roof (The large triangle with slight overhang) -->
  <path d="M 12 45 L 50 15 L 88 45" stroke="#48C3D3" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Inner Roof (Parallel to outer roof, forming the 'eave' effect) -->
  <path d="M 22 45 L 50 23 L 78 45" stroke="#48C3D3" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Chimney -->
  <rect x="22" y="19" width="8" height="15" stroke="#48C3D3" stroke-width="5" fill="none" />
</svg>
